<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Dates clés de l’Histoire de France</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Dates clés de l’Histoire de France</h1>
      <p class="subtitle">Choisis la bonne date pour chaque événement.</p>

      <div class="task" id="task">Question</div>
      <div class="word" id="word">—</div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>
    </main>

    <script>
      (async () => {
        const response = await fetch('../data/histoire-dates-cles.json');
        if (!response.ok) throw new Error('Impossible de charger les données historiques.');
        const { questions } = await response.json();

        const STORAGE_KEY = 'exercices-histoire-dates-cles';
        let stats = { good: 0, total: 0 };
        let current = null;
        let deck = [];

        function loadState() {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (saved.stats) stats = { ...stats, ...saved.stats };
          } catch (error) {
            console.warn('Impossible de charger le score.', error);
          }
        }

        function saveState() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ stats }));
        }

        function shuffle(items) {
          const copy = [...items];
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }

        function makeQuestion() {
          if (deck.length === 0) deck = shuffle(questions.map((_, index) => index));
          const index = deck.pop();
          const base = questions[index];
          return {
            ...base,
            options: shuffle(base.options)
          };
        }

        function updateScore() {
          const good = document.getElementById('good');
          const total = document.getElementById('total');
          const pct = document.getElementById('pct');

          good.textContent = stats.good;
          total.textContent = stats.total;
          const percentage = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
          pct.textContent = percentage === null ? '— %' : percentage + ' %';
          pct.style.color = percentage === null || percentage >= 70 ? '#16a34a' : '#dc2626';
        }

        function renderExercise() {
          current = makeQuestion();
          const taskEl = document.getElementById('task');
          const wordEl = document.getElementById('word');
          const feedbackEl = document.getElementById('feedback');
          const choicesEl = document.getElementById('choices');

          taskEl.textContent = 'Événement';
          wordEl.textContent = current.enonce;
          feedbackEl.textContent = '';
          feedbackEl.className = 'feedback';
          choicesEl.innerHTML = current.options
            .map((option) => '<button data-answer="' + option + '">' + option + '</button>')
            .join('');

          choicesEl.querySelectorAll('button').forEach((button) => {
            button.addEventListener('click', () => handleChoice(button.dataset.answer));
          });
        }

        function handleChoice(choice) {
          const feedbackEl = document.getElementById('feedback');
          const choicesEl = document.getElementById('choices');

          stats.total += 1;
          const isCorrect = choice === current.reponse;
          if (isCorrect) {
            stats.good += 1;
            feedbackEl.textContent = '✅ Bravo ! La bonne réponse est ' + current.reponse + '.';
            feedbackEl.className = 'feedback good';
          } else {
            feedbackEl.textContent = '❌ Faux. La bonne réponse était : ' + current.reponse;
            feedbackEl.className = 'feedback bad';
          }

          choicesEl.querySelectorAll('button').forEach((button) => {
            button.disabled = true;
          });

          updateScore();
          saveState();
          setTimeout(renderExercise, isCorrect ? 1500 : 2200);
        }

        document.getElementById('reset').addEventListener('click', () => {
          stats = { good: 0, total: 0 };
          saveState();
          updateScore();
          renderExercise();
        });

        loadState();
        updateScore();
        renderExercise();
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML = '<main class="card"><h1>Erreur</h1><p class="subtitle">Impossible de charger l’exercice.</p></main>';
      });
    </script>
  </body>
</html>
