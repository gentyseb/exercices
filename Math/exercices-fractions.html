<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Fractions</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f1f5f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
      .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 28px; width: 100%; max-width: 560px; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 4px; color: #1d4ed8; }
      .subtitle { color: #6b7280; margin: 0 0 18px; font-size: .92rem; }
      .settings { background: #f8fafc; border-radius: 12px; padding: 14px 16px; text-align: left; display: none; margin-top: 4px; }
      .settings.open { display: block; }
      .setting-row { margin-bottom: 12px; }
      .setting-row:last-child { margin-bottom: 0; }
      .setting-label { font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; font-weight: 700; margin-bottom: 5px; }
      select { width: 100%; padding: 9px 12px; font-size: .95rem; font-weight: 600; border: 2px solid #e5e7eb; border-radius: 10px; background: #fff; color: #374151; cursor: pointer; font-family: inherit; }
      select:focus { outline: none; border-color: #93c5fd; }
      .task { display: inline-block; margin: 10px 0 8px; padding: 6px 16px; font-size: .9rem; font-weight: 700; border-radius: 999px; background: #eff6ff; color: #1d4ed8; }
      .question { font-size: 2.2rem; font-weight: 800; margin: 6px 0 14px; display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
      .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; font-size: 2rem; }
      .frac .den { border-top: 3px solid #111827; padding-top: 2px; }
      .question input { width: 120px; font-size: 2rem; font-weight: 800; text-align: center; border: none; border-bottom: 4px solid #1d4ed8; background: transparent; color: #111827; outline: none; font-family: inherit; }
      .question input:disabled { opacity: .75; }
      .choices { display: flex; justify-content: center; gap: 16px; margin: 4px 0 18px; }
      .choices button {
        padding: 10px 18px; font-size: 1.2rem; font-weight: 800;
        border: 2px solid #e5e7eb; border-radius: 12px; background: #fff; color: #374151; cursor: pointer;
        transition: all .15s ease;
      }
      .choices button:hover:not(:disabled) { border-color: #1d4ed8; color: #1d4ed8; }
      .choices button:disabled { opacity: .55; cursor: default; }
      .feedback { min-height: 1.7rem; font-weight: 600; margin-bottom: 12px; font-size: 1.02rem; }
      .good { color: #16a34a; }
      .bad { color: #dc2626; }
      #check { padding: 13px 36px; font-size: 1rem; font-weight: 700; border: none; border-radius: 12px; background: #1d4ed8; color: #fff; cursor: pointer; margin-bottom: 18px; transition: background .15s ease; }
      #check:hover:not(:disabled) { background: #1e40af; }
      #check:disabled { opacity: .6; cursor: default; }
      .score { background: #f8fafc; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
      .score .label { color: #6b7280; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; }
      .score .numbers { font-size: 1.5rem; font-weight: 800; color: #1d4ed8; }
      .score .pct { font-size: 1.05rem; color: #16a34a; font-weight: 700; margin-top: 2px; }
      #reset { padding: 11px 26px; font-size: .95rem; font-weight: 600; border: none; border-radius: 12px; background: #6b7280; color: #fff; cursor: pointer; transition: background .15s ease; }
      #reset:hover { background: #4b5563; }
      .hint { color: #9ca3af; font-size: .78rem; margin-top: 12px; }
      #settingsToggle { margin: 16px 0 6px; padding: 10px 22px; font-size: .9rem; font-weight: 600; border: 2px solid #e5e7eb; border-radius: 12px; background: #f8fafc; color: #374151; cursor: pointer; transition: all .15s ease; }
      #settingsToggle:hover { border-color: #93c5fd; }
      #settingsToggle .arrow { display: inline-block; transition: transform .2s ease; }
      #settingsToggle.open .arrow { transform: rotate(180deg); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Fractions</h1>
      <p class="subtitle">Calcule ou compare les fractions.</p>

      <div class="task" id="task">—</div>
      <div class="question" id="question"></div>
      <div class="choices" id="choices" style="display:none"></div>
      <div class="feedback" id="feedback"></div>
      <button id="check">Vérifier</button>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-row">
          <div class="setting-label">Mode</div>
          <select id="setMode">
            <option value="mix">Mélange (calculer et comparer)</option>
            <option value="calculer">Calculer une fraction d'un nombre</option>
            <option value="comparer">Comparer deux fractions</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-label">Niveau</div>
          <select id="setLevel">
            <option value="facile">Facile (moitiés, tiers, quarts)</option>
            <option value="moyen">Moyen (dénominateurs jusqu'à 10)</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>
      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-fractions";
      let settings = { mode: "mix", level: "facile" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function maxDen() { return settings.level === "facile" ? 4 : 10; }

      function makeExercise() {
        const kind = settings.mode === "mix" ? pick(["calculer", "comparer"]) : settings.mode;
        if (kind === "calculer") {
          // num/den d'un multiple de den → réponse entière
          const den = randInt(2, maxDen());
          const num = randInt(1, den - 1);
          const whole = den * randInt(1, settings.level === "facile" ? 5 : 10);
          return { kind, num, den, whole, answer: num * (whole / den) };
        }
        // comparer : deux fractions différentes, la plus grande
        let n1, d1, n2, d2;
        do {
          d1 = randInt(2, maxDen()); n1 = randInt(1, d1);
          d2 = randInt(2, maxDen()); n2 = randInt(2, d2);
        } while (n1 * d2 === n2 * d1);
        const bigger = n1 * d2 > n2 * d1;
        return { kind, n1, d1, n2, d2, answer: bigger ? "f1" : "f2" };
      }

      // ---- Affichage ----
      const taskEl = document.getElementById("task");
      const questionEl = document.getElementById("question");
      const choicesEl = document.getElementById("choices");
      const feedbackEl = document.getElementById("feedback");
      const checkBtn = document.getElementById("check");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function fracHtml(num, den) {
        return '<span class="frac"><span class="num">' + num + '</span><span class="den">' + den + "</span></span>";
      }

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        const input = document.getElementById("answer");
        if (current.kind === "calculer") {
          checkBtn.style.display = "";
          checkBtn.disabled = false;
          choicesEl.style.display = "none";
          taskEl.textContent = "Calcule :";
          questionEl.innerHTML =
            fracHtml(current.num, current.den) + " <span>de " + current.whole + " =</span> " +
            '<input type="number" inputmode="numeric" min="0" id="answer" autocomplete="off" />';
          const inp = document.getElementById("answer");
          inp.value = "";
          inp.disabled = false;
          inp.focus();
          inp.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });
        } else {
          checkBtn.style.display = "none";
          choicesEl.style.display = "flex";
          taskEl.textContent = "Quelle fraction est la plus grande ?";
          questionEl.innerHTML = "";
          choicesEl.innerHTML =
            '<button data-answer="f1">' + fracHtml(current.n1, current.d1) + "</button>" +
            '<button data-answer="f2">' + fracHtml(current.n2, current.d2) + "</button>";
          choicesEl.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", () => handleChoice(btn));
          });
        }
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function finish(ok, full) {
        stats.total++;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + full + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + full;
          feedbackEl.className = "feedback bad";
        }
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      function checkAnswer() {
        if (answered) return;
        const input = document.getElementById("answer");
        if (!input || !input.value.trim()) {
          feedbackEl.textContent = "Écris ta réponse d'abord 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        answered = true;
        const given = parseFloat(input.value);
        const ok = given === current.answer;
        const full = current.num + "/" + current.den + " de " + current.whole + " = " + current.answer;
        input.disabled = true;
        checkBtn.disabled = true;
        finish(ok, full);
      }

      function handleChoice(btn) {
        if (answered) return;
        answered = true;
        const ok = btn.dataset.answer === current.answer;
        const f1 = current.n1 + "/" + current.d1;
        const f2 = current.n2 + "/" + current.d2;
        const full = (current.answer === "f1" ? f1 : f2) + " est plus grand que " + (current.answer === "f1" ? f2 : f1);
        choicesEl.querySelectorAll("button").forEach(b => (b.disabled = true));
        finish(ok, full);
      }

      checkBtn.addEventListener("click", checkAnswer);

      // ---- Réglages ----
      const modeSelect = document.getElementById("setMode");
      const levelSelect = document.getElementById("setLevel");
      modeSelect.addEventListener("change", () => { settings.mode = modeSelect.value; onSettingsChanged(); });
      levelSelect.addEventListener("change", () => { settings.level = levelSelect.value; onSettingsChanged(); });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        modeSelect.value = settings.mode;
        levelSelect.value = settings.level;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    </script>
  </body>
</html>
