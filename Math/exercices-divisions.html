<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Divisions</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Divisions</h1>
      <p class="subtitle">Écris le quotient (et le reste s'il y en a), puis clique sur Vérifier.</p>

      <div class="operation" id="operation"></div>
      <div class="feedback" id="feedback"></div>
      <button id="check">Vérifier</button>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-row">
          <div class="setting-label">Difficulté</div>
          <select id="setDifficulty">
            <option value="facile">Facile (2 chiffres ÷ 1 chiffre)</option>
            <option value="moyen">Moyen (3 chiffres ÷ 1 chiffre)</option>
            <option value="difficile">Difficile (3 chiffres ÷ 2 chiffres)</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-label">Reste</div>
          <select id="setReste">
            <option value="sans">Sans reste (division exacte)</option>
            <option value="avec">Avec reste</option>
            <option value="mix">Mix des deux</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>
      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-divisions";
      let settings = { difficulty: "facile", reste: "sans" };
      let stats = { good: 0, total: 0 };
      let current = null;   // { dividend, divisor, quotient, remainder }
      let answered = false;
      let pending = null;   // division en attente de réponse (sauvegardée)

      // ---- Sauvegarde / restauration (protégée) ----
      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) { /* localStorage indisponible */ }
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) { /* sauvegarde impossible : on ignore */ }
      }

      // ---- Génération des exercices (divisions exactes) ----
      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

      function makeExercise() {
        // dividend = divisor × quotient + remainder
        const avecReste = settings.reste === "mix" ? Math.random() < 0.5 : settings.reste === "avec";
        let divisor, qMin, qMax;
        if (settings.difficulty === "facile") {
          // 2 chiffres ÷ 1 chiffre (dividende entre 10 et 99)
          divisor = randInt(2, 9);
          qMin = Math.ceil(10 / divisor);
          qMax = Math.floor(99 / divisor);
        } else if (settings.difficulty === "moyen") {
          // 3 chiffres ÷ 1 chiffre (dividende entre 100 et 999)
          divisor = randInt(2, 9);
          qMin = Math.ceil(100 / divisor);
          qMax = Math.floor(999 / divisor);
        } else {
          // 3 chiffres ÷ 2 chiffres (dividende entre 100 et 999)
          divisor = randInt(10, 99);
          qMin = Math.max(2, Math.ceil(100 / divisor));
          qMax = Math.floor(999 / divisor);
        }
        if (avecReste) qMax = Math.max(qMin, qMax - 1); // marge pour le reste
        const quotient = randInt(qMin, qMax);
        const remainder = avecReste ? randInt(1, divisor - 1) : 0;
        const dividend = divisor * quotient + remainder;
        return { dividend, divisor, quotient, remainder };
      }

      // ---- Affichage ----
      const opEl = document.getElementById("operation");
      const feedbackEl = document.getElementById("feedback");
      const checkBtn = document.getElementById("check");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;           // on reprend exactement la même division
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        opEl.innerHTML =
          "<span>" + current.dividend + "</span> <span>÷</span> <span>" + current.divisor +
          "</span> <span>=</span> " +
          '<input type="number" inputmode="numeric" min="0" id="answer" autocomplete="off" style="width:90px" />';
        if (current.remainder > 0) {
          opEl.innerHTML +=
            ' <span>reste</span> <input type="number" inputmode="numeric" min="0" id="reste" autocomplete="off" style="width:80px" />';
        }
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        checkBtn.disabled = false;
        const input = document.getElementById("answer");
        input.value = "";
        input.disabled = false;
        input.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });
        const resteInput = document.getElementById("reste");
        if (resteInput) {
          resteInput.value = "";
          resteInput.disabled = false;
          resteInput.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });
        }
        input.focus();
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function checkAnswer() {
        if (answered) return;
        const input = document.getElementById("answer");
        const resteInput = document.getElementById("reste");
        const given = parseInt(input.value, 10);
        if (isNaN(given)) {
          feedbackEl.textContent = "Écris ta réponse d'abord 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        if (current.remainder > 0 && resteInput && isNaN(parseInt(resteInput.value, 10))) {
          feedbackEl.textContent = "N'oublie pas d'écrire le reste 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        answered = true;
        stats.total++;
        const ok = given === current.quotient &&
                   (current.remainder === 0 ||
                    (resteInput && parseInt(resteInput.value, 10) === current.remainder));
        let full = current.dividend + " ÷ " + current.divisor + " = " + current.quotient;
        if (current.remainder > 0) full += " reste " + current.remainder;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! C'est juste 🎉 (" + full + ")";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + full;
          feedbackEl.className = "feedback bad";
        }
        input.disabled = true;
        if (resteInput) resteInput.disabled = true;
        checkBtn.disabled = true;
        updateScore();
        saveState();                    // la question étant répondue, elle n'est plus "en attente"
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      checkBtn.addEventListener("click", checkAnswer);

      // ---- Réglages ----
      const difficultySelect = document.getElementById("setDifficulty");
      difficultySelect.addEventListener("change", () => {
        settings.difficulty = difficultySelect.value;
        onSettingsChanged();
      });

      const resteSelect = document.getElementById("setReste");
      resteSelect.addEventListener("change", () => {
        settings.reste = resteSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };   // changement de réglage : on repart de zéro
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        difficultySelect.value = settings.difficulty;
        resteSelect.value = settings.reste;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);   // restaure la division en cours si elle existe
    </script>
  </body>
</html>
