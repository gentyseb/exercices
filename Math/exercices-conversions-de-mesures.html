<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Conversions de mesures</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Conversions de mesures</h1>
      <p class="subtitle">Convertis la mesure, puis clique sur Vérifier (ou appuie sur Entrée).</p>

      <div class="operation" id="operation"></div>
      <div class="feedback" id="feedback"></div>
      <button id="check">Vérifier</button>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-label">Catégorie</div>
        <select id="setCat">
          <option value="mix">Mélange (tout)</option>
          <option value="longueur">Longueurs (m, cm, mm, km)</option>
          <option value="masse">Masses (kg, g)</option>
          <option value="contenance">Contenances (L, cL, mL)</option>
        </select>
        <div class="setting-row">
          <div class="setting-label">Niveau</div>
          <select id="setLevel">
            <option value="facile">Facile — sans virgule</option>
            <option value="difficile">Difficile — avec virgule</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>(async () => {
  const response = await fetch("../data/conversions-mesures.json");
  if (!response.ok) throw new Error('HTTP ' + response.status + ' loading ' + "../data/conversions-mesures.json");
  const { PAIRS } = await response.json();

      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-conversions";
      let settings = { cat: "mix", level: "facile" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      // Paires d'unités : [unité A, unité B, facteur A→B]
      

      function makeExercise() {
        const cat = settings.cat === "mix" ? pick(["longueur", "masse", "contenance"]) : settings.cat;
        const pair = pick(PAIRS[cat]);
        if (settings.level === "difficile") {
          let value;
          do {
            value = randInt(1, pair[2] * 2 - 1);
          } while (value % pair[2] === 0);
          return {
            cat,
            from: pair[1],
            to: pair[0],
            value,
            answer: value / pair[2]
          };
        }

        const toSmall = Math.random() < 0.6; // vers l'unité plus petite le plus souvent
        if (toSmall) {
          const value = randInt(1, 40);
          return { cat, from: pair[0], to: pair[1], value, answer: value * pair[2] };
        }
        // vers l'unité plus grande : valeur multiple du facteur, réponse entière
        const k = randInt(1, 20);
        const value = k * pair[2];
        return { cat, from: pair[1], to: pair[0], value, answer: k };
      }

      // ---- Affichage ----
      const opEl = document.getElementById("operation");
      const feedbackEl = document.getElementById("feedback");
      const checkBtn = document.getElementById("check");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        opEl.innerHTML =
          "<span>" + current.value + " " + current.from + " =</span> " +
          '<input type="text" inputmode="decimal" id="answer" autocomplete="off" /> ' +
          '<span class="unit">' + current.to + "</span>";
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        checkBtn.disabled = false;
        const input = document.getElementById("answer");
        input.value = "";
        input.disabled = false;
        input.focus();
        input.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function checkAnswer() {
        if (answered) return;
        const input = document.getElementById("answer");
        const answerText = input.value.trim().replace(",", ".");
        const given = Number(answerText);
        if (!answerText || !Number.isFinite(given)) {
          feedbackEl.textContent = "Écris ta réponse d'abord 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        answered = true;
        stats.total++;
        const ok = Math.abs(given - current.answer) < 1e-9;
        const formattedAnswer = String(current.answer).replace(".", ",");
        const full = current.value + " " + current.from + " = " + formattedAnswer + " " + current.to;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! C'est juste 🎉 (" + full + ")";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + full;
          feedbackEl.className = "feedback bad";
        }
        input.disabled = true;
        checkBtn.disabled = true;
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      checkBtn.addEventListener("click", checkAnswer);

      // ---- Réglages ----
      const catSelect = document.getElementById("setCat");
      const levelSelect = document.getElementById("setLevel");
      catSelect.addEventListener("change", () => {
        settings.cat = catSelect.value;
        onSettingsChanged();
      });
      levelSelect.addEventListener("change", () => {
        settings.level = levelSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        catSelect.value = settings.cat;
        levelSelect.value = settings.level;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    
})().catch(error => {
  console.error('Erreur de chargement des données de l’exercice :', error);
  document.body.textContent = 'Impossible de charger les données de l’exercice. Vérifie que le site est lancé depuis un serveur web.';
});
</script>
  </body>
</html>
