<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Comparaisons</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Comparaisons</h1>
      <p class="subtitle">Clique sur le bon signe : plus petit, plus grand ou égal.</p>

      <div class="operation" id="operation"></div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices">
        <button data-answer="&lt;">&lt;</button>
        <button data-answer="&gt;">&gt;</button>
        <button data-answer="=">=</button>
      </div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-label">Nombres jusqu'à…</div>
        <select id="setRange">
          <option value="20">20</option>
          <option value="100">100</option>
          <option value="1000">1 000</option>
          <option value="10000">10 000</option>
        </select>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>
      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-comparaisons";
      let settings = { range: 100 };
      let stats = { good: 0, total: 0 };
      let current = null;   // { a, b, answer }
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

      function makeExercise() {
        const max = settings.range;
        // 1 fois sur 6, les deux nombres sont égaux (pour travailler le =)
        if (Math.random() < 1 / 6) {
          const n = randInt(0, max);
          return { a: n, b: n, answer: "=" };
        }
        const a = randInt(0, max);
        const b = randInt(0, max);
        if (a === b) return { a, b, answer: "=" };
        return { a, b, answer: a < b ? "<" : ">" };
      }

      // ---- Affichage ----
      const opEl = document.getElementById("operation");
      const feedbackEl = document.getElementById("feedback");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");
      const buttons = Array.from(document.querySelectorAll("#choices button"));

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        opEl.innerHTML =
          "<span>" + current.a + "</span> " +
          '<span class="box" id="signBox">?</span> ' +
          "<span>" + current.b + "</span>";
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        buttons.forEach(b => (b.disabled = false));
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function handleChoice(btn) {
        if (answered) return;
        answered = true;
        stats.total++;
        const ok = btn.dataset.answer === current.answer;
        document.getElementById("signBox").textContent = current.answer;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.a + " " + current.answer + " " + current.b + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + current.a + " " + current.answer + " " + current.b;
          feedbackEl.className = "feedback bad";
        }
        buttons.forEach(b => (b.disabled = true));
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      buttons.forEach(btn => btn.addEventListener("click", () => handleChoice(btn)));

      // ---- Réglages ----
      const rangeSelect = document.getElementById("setRange");
      rangeSelect.addEventListener("change", () => {
        settings.range = parseInt(rangeSelect.value, 10);
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        rangeSelect.value = String(settings.range);
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    </script>
  </body>
</html>
