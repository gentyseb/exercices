<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Petits problèmes</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Petits problèmes</h1>
      <p class="subtitle">Lis le problème, calcule la réponse, puis clique sur Vérifier.</p>

      <div class="problem" id="problem"></div>
      <div class="answer-row">
        <label for="answer">Ma réponse :</label>
        <input type="number" inputmode="numeric" min="0" id="answer" autocomplete="off" />
      </div>
      <div class="feedback" id="feedback"></div>
      <button id="check">Vérifier</button>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-row">
          <div class="setting-label">Opérations</div>
          <select id="setOp">
            <option value="mix">Mélange (tout)</option>
            <option value="add">Additions seulement</option>
            <option value="sous">Soustractions seulement</option>
            <option value="mult">Multiplications seulement</option>
          </select>
        </div>
        <div class="setting-row">
          <div class="setting-label">Niveau</div>
          <select id="setLevel">
            <option value="20">Nombres jusqu'à 20</option>
            <option value="100">Nombres jusqu'à 100</option>
            <option value="1000">Nombres jusqu'à 1 000</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>(async () => {
  const response = await fetch("../data/petits-problemes.json");
  if (!response.ok) throw new Error('HTTP ' + response.status + ' loading ' + "../data/petits-problemes.json");
  const { NAMES, OBJECTS } = await response.json();

      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-problemes";
      let settings = { op: "mix", level: 20 };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      // [prénom, pronom] pour des phrases correctes
      

      // [singulier, pluriel] pour des phrases correctes
      

      function makeExercise() {
        const max = settings.level;
        const op = settings.op === "mix" ? pick(["add", "sous", "mult"]) : settings.op;
        const [name, pron] = pick(NAMES);
        const [otherName] = pick(NAMES.filter(n => n[0] !== name));
        const obj = pick(OBJECTS);
        if (op === "add") {
          const a = randInt(2, max - 2);
          const b = randInt(1, Math.min(20, max - a));
          return {
            text: name + " a " + a + " " + (a > 1 ? obj[1] : obj[0]) + ". " + otherName + " lui en donne " + b + ". Combien " + name + " a-t" + (pron === "Elle" ? "-elle" : "-il") + " maintenant de " + obj[1] + " ?",
            answer: a + b, detail: a + " + " + b + " = " + (a + b)
          };
        }
        if (op === "sous") {
          const a = randInt(5, max);
          const b = randInt(1, a - 1);
          return {
            text: name + " avait " + a + " " + (a > 1 ? obj[1] : obj[0]) + ". " + pron + " en perd " + b + " en récréation. Combien lui en reste-t-il ?",
            answer: a - b, detail: a + " − " + b + " = " + (a - b)
          };
        }
        const boxes = randInt(2, Math.min(10, Math.floor(max / 2)));
        const per = randInt(2, Math.max(2, Math.min(10, Math.floor(max / boxes))));
        return {
          text: "Une boîte contient " + per + " " + (per > 1 ? obj[1] : obj[0]) + ". Combien de " + obj[1] + " y a-t-il dans " + boxes + " boîtes ?",
          answer: per * boxes, detail: per + " × " + boxes + " = " + (per * boxes)
        };
      }

      // ---- Affichage ----
      const problemEl = document.getElementById("problem");
      const feedbackEl = document.getElementById("feedback");
      const checkBtn = document.getElementById("check");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");
      const input = document.getElementById("answer");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        problemEl.textContent = current.text;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        checkBtn.disabled = false;
        input.value = "";
        input.disabled = false;
        input.focus();
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function checkAnswer() {
        if (answered) return;
        const given = parseInt(input.value, 10);
        if (isNaN(given)) {
          feedbackEl.textContent = "Écris ta réponse d'abord 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        answered = true;
        stats.total++;
        const ok = given === current.answer;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.detail + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était " + current.answer + ". (" + current.detail + ")";
          feedbackEl.className = "feedback bad";
        }
        input.disabled = true;
        checkBtn.disabled = true;
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 3000 : 5500);
      }

      checkBtn.addEventListener("click", checkAnswer);
      input.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });

      // ---- Réglages ----
      const opSelect = document.getElementById("setOp");
      const levelSelect = document.getElementById("setLevel");
      opSelect.addEventListener("change", () => { settings.op = opSelect.value; onSettingsChanged(); });
      levelSelect.addEventListener("change", () => { settings.level = parseInt(levelSelect.value, 10); onSettingsChanged(); });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        opSelect.value = settings.op;
        levelSelect.value = String(settings.level);
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    
})().catch(error => {
  console.error('Erreur de chargement des données de l’exercice :', error);
  document.body.textContent = 'Impossible de charger les données de l’exercice. Vérifie que le site est lancé depuis un serveur web.';
});
</script>
  </body>
</html>
