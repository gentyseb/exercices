<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Les états de la matière</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Les états de la matière</h1>
      <p class="subtitle">Découvre les solides, les liquides, les gaz et leurs transformations.</p>
      <div class="task" id="question">Chargement de la question…</div>
      <div class="feedback" id="feedback" role="status"></div>
      <div class="choices" id="choices"></div>
      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="percentage">— %</div>
      </div>
      <button id="reset" type="button">Réinitialiser le score</button>
      <p class="hint">Ton score est sauvegardé automatiquement.</p>
    </main>
    <script>
      const STORAGE_KEY = "exercices-sciences-etats-matiere";
      window.CHOICE_EXERCISE_CONFIG = {
        storageKey: STORAGE_KEY,
        dataUrl: "../data/sciences-etats-matiere.json"
      };
    </script>
    <script src="../core/choice-exercise.js"></script>
  </body>
</html>
