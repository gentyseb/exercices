<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Corps humain</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Corps humain</h1>
      <p class="subtitle">À quoi sert chaque organe du corps humain ?</p>
      <p class="subtitle">Associe chaque organe à sa fonction.</p>

      <div class="task" id="task">Question</div>
      <div class="word" id="word">—</div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-row">
          <div class="setting-label">Difficulté</div>
          <select id="setDifficulty">
            <option value="facile">Facile</option>
            <option value="normal">Normal</option>
            <option value="difficile">Difficile</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>
      (async () => {
        const response = await fetch('../data/sciences-corps-humain.json');
        if (!response.ok) throw new Error('Impossible de charger les données du corps humain.');
        const { questions, config = {} } = await response.json();

        const STORAGE_KEY = 'exercices-sciences-corps-humain';
        const difficultyOrder = {
          facile: ['facile'],
          normal: ['facile', 'normal'],
          difficile: ['facile', 'normal', 'difficile']
        };

        const defaultSettings = {
          difficulty: config.difficulty || 'normal'
        };
        let settings = { ...defaultSettings };
        let stats = { good: 0, total: 0 };
        let current = null;
        let deck = [];

        function loadState() {
          try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            if (saved.stats) stats = { ...stats, ...saved.stats };
            if (saved.settings && saved.settings.difficulty) {
              settings.difficulty = saved.settings.difficulty;
            }
          } catch (error) {
            console.warn('Impossible de charger le score.', error);
          }
        }

        function saveState() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ stats, settings }));
        }

        function shuffle(items) {
          const copy = [...items];
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }

        function getAvailableQuestions() {
          const allowed = difficultyOrder[settings.difficulty] || difficultyOrder.normal;
          const filtered = questions.filter((item) => allowed.includes(item.difficulte));
          return filtered.length > 0 ? filtered : questions;
        }

        function resetDeck() {
          const available = getAvailableQuestions();
          deck = shuffle(available);
        }

        function makeQuestion() {
          if (deck.length === 0) resetDeck();
          const item = deck.pop();
          if (!item) {
            const fallback = questions[0];
            return { ...fallback, options: shuffle(fallback.options) };
          }
          return {
            ...item,
            options: shuffle(item.options)
          };
        }

        function updateScore() {
          const good = document.getElementById('good');
          const total = document.getElementById('total');
          const pct = document.getElementById('pct');

          good.textContent = stats.good;
          total.textContent = stats.total;
          const percentage = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
          pct.textContent = percentage === null ? '— %' : percentage + ' %';
          pct.style.color = percentage === null || percentage >= 70 ? '#16a34a' : '#dc2626';
        }

        function renderExercise() {
          current = makeQuestion();
          const taskEl = document.getElementById('task');
          const wordEl = document.getElementById('word');
          const feedbackEl = document.getElementById('feedback');
          const choicesEl = document.getElementById('choices');

          taskEl.textContent = 'Organe';
          wordEl.textContent = current.organe;
          feedbackEl.textContent = '';
          feedbackEl.className = 'feedback';
          choicesEl.innerHTML = current.options
            .map((option) => '<button data-answer="' + option + '">' + option + '</button>')
            .join('');

          choicesEl.querySelectorAll('button').forEach((button) => {
            button.addEventListener('click', () => handleChoice(button.dataset.answer));
          });
        }

        function handleChoice(choice) {
          const feedbackEl = document.getElementById('feedback');
          const choicesEl = document.getElementById('choices');

          stats.total += 1;
          const isCorrect = choice === current.reponse;
          if (isCorrect) {
            stats.good += 1;
            feedbackEl.textContent = '✅ Bravo ! ' + current.organe + ' sert à ' + current.reponse + '.';
            feedbackEl.className = 'feedback good';
          } else {
            feedbackEl.textContent = '❌ Faux. La bonne réponse était : ' + current.reponse;
            feedbackEl.className = 'feedback bad';
          }

          choicesEl.querySelectorAll('button').forEach((button) => {
            button.disabled = true;
          });

          updateScore();
          saveState();
          setTimeout(renderExercise, isCorrect ? 1500 : 2200);
        }

        function refreshSettingsUI() {
          document.getElementById('setDifficulty').value = settings.difficulty;
        }

        function onSettingsChanged() {
          stats = { good: 0, total: 0 };
          resetDeck();
          saveState();
          refreshSettingsUI();
          updateScore();
          renderExercise();
        }

        document.getElementById('setDifficulty').addEventListener('change', (event) => {
          settings.difficulty = event.target.value;
          onSettingsChanged();
        });

        document.getElementById('settingsToggle').addEventListener('click', () => {
          document.getElementById('settingsPanel').classList.toggle('open');
          document.getElementById('settingsToggle').classList.toggle('open');
        });

        document.getElementById('reset').addEventListener('click', () => {
          stats = { good: 0, total: 0 };
          resetDeck();
          saveState();
          updateScore();
          renderExercise();
        });

        loadState();
        refreshSettingsUI();
        resetDeck();
        updateScore();
        renderExercise();
      })().catch((error) => {
        console.error(error);
        document.body.innerHTML = '<main class="card"><h1>Erreur</h1><p class="subtitle">Impossible de charger l’exercice.</p></main>';
      });
    </script>
  </body>
</html>
