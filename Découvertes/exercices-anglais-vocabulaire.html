<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Anglais</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Anglais — vocabulaire</h1>
      <p class="subtitle">Comment dit-on en anglais ? Choisis la bonne traduction.</p>

      <div class="task" id="task">Comment dit-on « <span id="word">—</span> » en anglais ?</div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-label">Thème</div>
        <select id="setTheme">
          <option value="mix">Mélange (tout)</option>
          <option value="couleurs">Couleurs</option>
          <option value="animaux">Animaux</option>
          <option value="nombres">Nombres (1 à 20)</option>
          <option value="famille">Famille</option>
        </select>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>(async () => {
  const response = await fetch("../data/anglais-vocabulaire.json");
  if (!response.ok) throw new Error('HTTP ' + response.status + ' loading ' + "../data/anglais-vocabulaire.json");
  const { THEMES } = await response.json();

      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-anglais";
      let settings = { theme: "mix" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- Données : français → anglais, par thème ----
      

      let deck = [];
      function activePairs() {
        if (settings.theme === "mix") return [].concat(THEMES.couleurs, THEMES.animaux, THEMES.nombres, THEMES.famille);
        return THEMES[settings.theme];
      }

      function makeExercise() {
        if (settings.theme === "mix") {
          // dans le mode mélange, les distracteurs viennent du même thème pour rester justes
          const themeKey = pick(Object.keys(THEMES));
          const pool = THEMES[themeKey];
          const [fr, en] = pick(pool);
          const others = shuffle(pool.filter(p => p[1] !== en)).slice(0, 3).map(p => p[1]);
          return { fr, answer: en, choices: shuffle([en].concat(others)) };
        }
        const pool = THEMES[settings.theme];
        if (deck.length === 0) deck = shuffle(pool);
        const [fr, en] = deck.pop();
        const others = shuffle(pool.filter(p => p[1] !== en)).slice(0, 3).map(p => p[1]);
        return { fr, answer: en, choices: shuffle([en].concat(others)) };
      }

      // ---- Affichage ----
      const wordEl = document.getElementById("word");
      const feedbackEl = document.getElementById("feedback");
      const choicesEl = document.getElementById("choices");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        wordEl.textContent = current.fr;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        choicesEl.innerHTML = current.choices.map(c =>
          '<button data-answer="' + c + '">' + c + "</button>"
        ).join("");
        choicesEl.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => handleChoice(btn));
        });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function handleChoice(btn) {
        if (answered) return;
        answered = true;
        stats.total++;
        const ok = btn.dataset.answer === current.answer;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.fr + " = " + current.answer + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… « " + current.fr + " » se dit : " + current.answer;
          feedbackEl.className = "feedback bad";
        }
        choicesEl.querySelectorAll("button").forEach(b => (b.disabled = true));
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      // ---- Réglages ----
      const themeSelect = document.getElementById("setTheme");
      themeSelect.addEventListener("change", () => {
        settings.theme = themeSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        deck = [];
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        themeSelect.value = settings.theme;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    
})().catch(error => {
  console.error('Erreur de chargement des données de l’exercice :', error);
  document.body.textContent = 'Impossible de charger les données de l’exercice. Vérifie que le site est lancé depuis un serveur web.';
});
</script>
  </body>
</html>
