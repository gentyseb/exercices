<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Géographie</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Géographie</h1>
      <p class="subtitle">Choisis la bonne réponse parmi les quatre propositions.</p>

      <div class="task" id="task">—</div>
      <div class="word" id="word">—</div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-label">Catégorie</div>
        <select id="setMode">
          <option value="monde">Capitales du monde</option>
          <option value="europe">Capitales d'Europe</option>
          <option value="departements">Villes et départements français</option>
          <option value="regions">Villes et régions françaises</option>
          <option value="fleuves">Fleuves et villes</option>
          <option value="melange">Mélangé (toutes les catégories)</option>
        </select>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>(async () => {
  const response = await fetch("../data/geographie-capitales-departements.json");
  if (!response.ok) throw new Error('HTTP ' + response.status + ' loading ' + "../data/geographie-capitales-departements.json");
  const { EUROPE, MONDE, DEPARTEMENTS, REGIONS, FLEUVES } = await response.json();

      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-geographie";
      let settings = { mode: "monde" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- Données ----
      
      
      

      const MODES = {
        monde:      { data: Object.assign({}, EUROPE, MONDE), task: "Quelle est la capitale de ce pays ?", prompt: s => s },
        europe:     { data: EUROPE, task: "Quelle est la capitale de ce pays ?", prompt: s => s },
        departements: { data: DEPARTEMENTS, task: "Dans quel département se trouve cette ville ?", prompt: s => s },
        regions:    { data: REGIONS, task: "Dans quelle région se trouve cette ville ?", prompt: s => s },
        fleuves:    { data: FLEUVES, task: "Par quelle ville passe ce fleuve ?", prompt: s => s }
      };

      let deck = [];
      function makeExercise() {
        const selectedModes = settings.mode === "melange"
          ? [MODES.monde, MODES.departements, MODES.regions, MODES.fleuves]
          : [MODES[settings.mode]];
        const questions = selectedModes.flatMap(def =>
          Object.entries(def.data).map(([key, answer]) => ({
            key,
            answer,
            task: def.task,
            answers: Object.values(def.data)
          }))
        );
        if (deck.length === 0) deck = shuffle(questions);
        const question = deck.pop();
        // 3 distracteurs pris dans les autres valeurs
        const others = shuffle(question.answers.filter(v => v !== question.answer)).slice(0, 3);
        return {
          key: question.key,
          answer: question.answer,
          choices: shuffle([question.answer].concat(others)),
          task: question.task
        };
      }

      // ---- Affichage ----
      const taskEl = document.getElementById("task");
      const wordEl = document.getElementById("word");
      const feedbackEl = document.getElementById("feedback");
      const choicesEl = document.getElementById("choices");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        taskEl.textContent = current.task;
        wordEl.textContent = current.key;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        choicesEl.innerHTML = current.choices.map(c =>
          '<button data-answer="' + c + '">' + c + "</button>"
        ).join("");
        choicesEl.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => handleChoice(btn));
        });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function handleChoice(btn) {
        if (answered) return;
        answered = true;
        stats.total++;
        const ok = btn.dataset.answer === current.answer;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.key + " → " + current.answer + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + current.answer;
          feedbackEl.className = "feedback bad";
        }
        choicesEl.querySelectorAll("button").forEach(b => (b.disabled = true));
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      // ---- Réglages ----
      const modeSelect = document.getElementById("setMode");
      modeSelect.addEventListener("change", () => {
        settings.mode = modeSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        deck = [];
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        modeSelect.value = settings.mode;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    
})().catch(error => {
  console.error('Erreur de chargement des données de l’exercice :', error);
  document.body.textContent = 'Impossible de charger les données de l’exercice. Vérifie que le site est lancé depuis un serveur web.';
});
</script>
  </body>
</html>
