<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Géographie</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; background: #f1f5f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
      .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 28px; width: 100%; max-width: 600px; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 4px; color: #1d4ed8; }
      .subtitle { color: #6b7280; margin: 0 0 18px; font-size: .92rem; }
      .settings { background: #f8fafc; border-radius: 12px; padding: 14px 16px; text-align: left; display: none; margin-top: 4px; }
      .settings.open { display: block; }
      .setting-label { font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; font-weight: 700; margin-bottom: 5px; }
      select { width: 100%; padding: 9px 12px; font-size: .95rem; font-weight: 600; border: 2px solid #e5e7eb; border-radius: 10px; background: #fff; color: #374151; cursor: pointer; font-family: inherit; }
      select:focus { outline: none; border-color: #93c5fd; }
      .task { display: inline-block; margin: 10px 0 10px; padding: 6px 16px; font-size: .9rem; font-weight: 700; border-radius: 999px; background: #eff6ff; color: #1d4ed8; }
      .word { font-size: 2.2rem; font-weight: 800; margin: 4px 0 16px; }
      .feedback { min-height: 1.7rem; font-weight: 600; margin-bottom: 14px; font-size: 1.02rem; }
      .good { color: #16a34a; }
      .bad { color: #dc2626; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
      .choices button {
        padding: 13px 10px; font-size: 1.02rem; font-weight: 700;
        border: 2px solid #e5e7eb; border-radius: 12px; background: #fff; color: #374151; cursor: pointer;
        transition: all .15s ease;
      }
      .choices button:hover:not(:disabled) { border-color: #1d4ed8; color: #1d4ed8; }
      .choices button:disabled { opacity: .55; cursor: default; }
      .score { background: #f8fafc; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
      .score .label { color: #6b7280; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; }
      .score .numbers { font-size: 1.5rem; font-weight: 800; color: #1d4ed8; }
      .score .pct { font-size: 1.05rem; color: #16a34a; font-weight: 700; margin-top: 2px; }
      #reset { padding: 11px 26px; font-size: .95rem; font-weight: 600; border: none; border-radius: 12px; background: #6b7280; color: #fff; cursor: pointer; transition: background .15s ease; }
      #reset:hover { background: #4b5563; }
      .hint { color: #9ca3af; font-size: .78rem; margin-top: 12px; }
      #settingsToggle { margin: 16px 0 6px; padding: 10px 22px; font-size: .9rem; font-weight: 600; border: 2px solid #e5e7eb; border-radius: 12px; background: #f8fafc; color: #374151; cursor: pointer; transition: all .15s ease; }
      #settingsToggle:hover { border-color: #93c5fd; }
      #settingsToggle .arrow { display: inline-block; transition: transform .2s ease; }
      #settingsToggle.open .arrow { transform: rotate(180deg); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Géographie</h1>
      <p class="subtitle">Choisis la bonne réponse parmi les quatre propositions.</p>

      <div class="task" id="task">—</div>
      <div class="word" id="word">—</div>
      <div class="feedback" id="feedback"></div>
      <div class="choices" id="choices"></div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-label">Catégorie</div>
        <select id="setMode">
          <option value="monde">Capitales du monde</option>
          <option value="europe">Capitales d'Europe</option>
          <option value="departements">Villes et départements français</option>
        </select>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>
      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-geographie";
      let settings = { mode: "monde" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ---- Données ----
      const EUROPE = {
        "France": "Paris", "Allemagne": "Berlin", "Italie": "Rome", "Espagne": "Madrid",
        "Royaume-Uni": "Londres", "Belgique": "Bruxelles", "Suisse": "Berne", "Portugal": "Lisbonne",
        "Pays-Bas": "Amsterdam", "Autriche": "Vienne", "Grèce": "Athènes", "Pologne": "Varsovie",
        "Suède": "Stockholm", "Norvège": "Oslo", "Danemark": "Copenhague", "Irlande": "Dublin",
        "Finlande": "Helsinki", "Russie": "Moscou", "Ukraine": "Kyiv", "Tchéquie": "Prague"
      };
      const MONDE = {
        "Turquie": "Ankara", "Égypte": "Le Caire", "Maroc": "Rabat", "Algérie": "Alger",
        "Tunisie": "Tunis", "Sénégal": "Dakar", "Chine": "Pékin", "Japon": "Tokyo",
        "Inde": "New Delhi", "Corée du Sud": "Séoul", "États-Unis": "Washington", "Canada": "Ottawa",
        "Mexique": "Mexico", "Brésil": "Brasilia", "Argentine": "Buenos Aires", "Australie": "Canberra",
        "Cameroun": "Yaoundé", "Madagascar": "Antananarivo", "Pérou": "Lima"
      };
      const DEPARTEMENTS = {
        "Paris": "Paris", "Lyon": "Rhône", "Marseille": "Bouches-du-Rhône", "Bordeaux": "Gironde",
        "Lille": "Nord", "Toulouse": "Haute-Garonne", "Nantes": "Loire-Atlantique", "Strasbourg": "Bas-Rhin",
        "Montpellier": "Hérault", "Rennes": "Ille-et-Vilaine", "Clermont-Ferrand": "Puy-de-Dôme",
        "Dijon": "Côte-d'Or", "Orléans": "Loiret", "Rouen": "Seine-Maritime", "Nancy": "Meurthe-et-Moselle",
        "Amiens": "Somme", "Angers": "Maine-et-Loire", "Reims": "Marne", "Grenoble": "Isère",
        "Besançon": "Doubs", "Limoges": "Haute-Vienne", "Caen": "Calvados", "Tours": "Indre-et-Loire",
        "Pau": "Pyrénées-Atlantiques", "Metz": "Moselle"
      };

      const MODES = {
        monde:      { data: Object.assign({}, EUROPE, MONDE), task: "Quelle est la capitale de ce pays ?", prompt: s => s },
        europe:     { data: EUROPE, task: "Quelle est la capitale de ce pays ?", prompt: s => s },
        departements: { data: DEPARTEMENTS, task: "Dans quel département se trouve cette ville ?", prompt: s => s }
      };

      let deck = [];
      function makeExercise() {
        const def = MODES[settings.mode];
        const keys = Object.keys(def.data);
        if (deck.length === 0) deck = shuffle(keys);
        const key = deck.pop();
        const answer = def.data[key];
        // 3 distracteurs pris dans les autres valeurs
        const others = shuffle(Object.values(def.data).filter(v => v !== answer)).slice(0, 3);
        return { key, answer, choices: shuffle([answer].concat(others)), task: def.task };
      }

      // ---- Affichage ----
      const taskEl = document.getElementById("task");
      const wordEl = document.getElementById("word");
      const feedbackEl = document.getElementById("feedback");
      const choicesEl = document.getElementById("choices");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        taskEl.textContent = current.task;
        wordEl.textContent = current.key;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        choicesEl.innerHTML = current.choices.map(c =>
          '<button data-answer="' + c + '">' + c + "</button>"
        ).join("");
        choicesEl.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => handleChoice(btn));
        });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function handleChoice(btn) {
        if (answered) return;
        answered = true;
        stats.total++;
        const ok = btn.dataset.answer === current.answer;
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.key + " → " + current.answer + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + current.answer;
          feedbackEl.className = "feedback bad";
        }
        choicesEl.querySelectorAll("button").forEach(b => (b.disabled = true));
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      // ---- Réglages ----
      const modeSelect = document.getElementById("setMode");
      modeSelect.addEventListener("change", () => {
        settings.mode = modeSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        deck = [];
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        modeSelect.value = settings.mode;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    </script>
  </body>
</html>
