<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices : Accords</title>
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Accords : pluriel et féminin</h1>
      <p class="subtitle">Écris le mot transformé, puis clique sur Vérifier (ou appuie sur Entrée).</p>

      <div class="task" id="task">—</div>
      <div class="question" id="question"></div>
      <div class="feedback" id="feedback"></div>
      <button id="check">Vérifier</button>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser le score</button>

      <button id="settingsToggle">⚙️ Paramètres <span class="arrow">▾</span></button>
      <div class="settings" id="settingsPanel">
        <div class="setting-row">
          <div class="setting-label">Mode</div>
          <select id="setMode">
            <option value="mix">Mélange (pluriel et féminin)</option>
            <option value="pluriel">Pluriel seulement</option>
            <option value="feminin">Féminin seulement</option>
          </select>
        </div>
      </div>
      <div class="hint">Ton score et tes réglages sont sauvegardés automatiquement.</div>
    </main>

    <script>(async () => {
  const response = await fetch("../data/accords.json");
  if (!response.ok) throw new Error('HTTP ' + response.status + ' loading ' + "../data/accords.json");
  const { WORDS } = await response.json();

      // ---- Paramètres et état ----
      const STORAGE_KEY = "exercices-accords";
      let settings = { mode: "mix" };
      let stats = { good: 0, total: 0 };
      let current = null;
      let answered = false;
      let pending = null;

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.settings) settings = Object.assign(settings, parsed.settings);
            if (parsed && parsed.stats) stats = Object.assign(stats, parsed.stats);
            if (parsed && parsed.pending) pending = parsed.pending;
          }
        } catch (e) {}
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            settings, stats,
            pending: (current && !answered) ? current : null
          }));
        } catch (e) {}
      }

      // ---- Données : [masculin singulier, pluriel, féminin] ----
      // Pluriels en -s ou -x (règles CE2 : -al → -aux, -eau → -eaux)
      

      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      function makeExercise() {
        const kind = settings.mode === "mix" ? pick(["pluriel", "feminin"]) : settings.mode;
        const entry = pick(WORDS);
        if (kind === "pluriel") {
          return { word: entry[0], kind, task: "Écris au pluriel :", answer: entry[1] };
        }
        return { word: entry[0], kind, task: "Écris au féminin :", answer: entry[2] };
      }

      // ---- Affichage ----
      const taskEl = document.getElementById("task");
      const questionEl = document.getElementById("question");
      const feedbackEl = document.getElementById("feedback");
      const checkBtn = document.getElementById("check");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");

      function renderExercise(restore) {
        if (restore && pending) {
          current = pending;
          pending = null;
        } else {
          current = makeExercise();
        }
        answered = false;
        saveState();
        taskEl.textContent = current.task;
        questionEl.innerHTML =
          "<span>" + current.word + "</span> <span>→</span> " +
          '<input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" />';
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        checkBtn.disabled = false;
        const input = document.getElementById("answer");
        input.value = "";
        input.disabled = false;
        input.focus();
        input.addEventListener("keydown", e => { if (e.key === "Enter" && !answered) checkAnswer(); });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      function normalize(s) {
        return s.trim().toLowerCase()
          .replace(/[éèêë]/g, "e").replace(/[àâä]/g, "a").replace(/[îï]/g, "i")
          .replace(/[ôö]/g, "o").replace(/[ùûü]/g, "u").replace(/ç/g, "c")
          .replace(/[\s'-]/g, "");
      }

      function checkAnswer() {
        if (answered) return;
        const input = document.getElementById("answer");
        if (!input.value.trim()) {
          feedbackEl.textContent = "Écris ta réponse d'abord 🙂";
          feedbackEl.className = "feedback";
          return;
        }
        answered = true;
        stats.total++;
        const ok = normalize(input.value) === normalize(current.answer);
        if (ok) {
          stats.good++;
          feedbackEl.textContent = "Bravo ! " + current.word + " → " + current.answer + " 🎉";
          feedbackEl.className = "feedback good";
        } else {
          feedbackEl.textContent = "Oups… La bonne réponse était : " + current.word + " → " + current.answer;
          feedbackEl.className = "feedback bad";
        }
        input.disabled = true;
        checkBtn.disabled = true;
        updateScore();
        saveState();
        setTimeout(renderExercise, ok ? 2500 : 4500);
      }

      checkBtn.addEventListener("click", checkAnswer);

      // ---- Réglages ----
      const modeSelect = document.getElementById("setMode");
      modeSelect.addEventListener("change", () => {
        settings.mode = modeSelect.value;
        onSettingsChanged();
      });

      function onSettingsChanged() {
        stats = { good: 0, total: 0 };
        pending = null;
        saveState();
        refreshSettingsUI();
        updateScore();
        renderExercise();
      }

      function refreshSettingsUI() {
        modeSelect.value = settings.mode;
      }

      const settingsToggle = document.getElementById("settingsToggle");
      settingsToggle.addEventListener("click", () => {
        document.getElementById("settingsPanel").classList.toggle("open");
        settingsToggle.classList.toggle("open");
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveState();
        updateScore();
        renderExercise();
      });

      // ---- Démarrage ----
      loadState();
      refreshSettingsUI();
      updateScore();
      renderExercise(true);
    
})().catch(error => {
  console.error('Erreur de chargement des données de l’exercice :', error);
  document.body.textContent = 'Impossible de charger les données de l’exercice. Vérifie que le site est lancé depuis un serveur web.';
});
</script>
  </body>
</html>
