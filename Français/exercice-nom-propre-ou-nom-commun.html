<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nom propre ou nom commun ?</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111827;
        background: #f1f5f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
        padding: 32px;
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 6px;
        color: #1d4ed8;
      }
      .subtitle { color: #6b7280; margin: 0 0 20px; font-size: .95rem; }
      .word-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 18px 0 6px;
      }
      .word {
        font-size: 2.6rem;
        font-weight: 800;
        min-height: 3.4rem;
        letter-spacing: .5px;
      }
      a.search-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #eff6ff;
        border: 2px solid #bfdbfe;
        color: #1d4ed8;
        cursor: pointer;
        transition: all .15s ease;
        flex: 0 0 auto;
        text-decoration: none;
      }
      a.search-icon:hover { background: #dbeafe; transform: scale(1.08); }
      a.search-icon svg { width: 20px; height: 20px; }
      .word-meaning { color: #6b7280; font-size: .85rem; margin-bottom: 6px; }
      .word-meaning a { color: #1d4ed8; }
      .feedback {
        min-height: 1.6rem;
        font-weight: 600;
        margin-bottom: 12px;
        font-size: 1.05rem;
      }
      .good { color: #16a34a; }
      .bad { color: #dc2626; }
      .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      button.choice {
        flex: 1 1 30%;
        min-width: 140px;
        padding: 14px 10px;
        font-size: 1rem;
        font-weight: 600;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        background: #f8fafc;
        color: #111827;
        cursor: pointer;
        transition: all .15s ease;
      }
      button.choice:hover:not(:disabled) {
        border-color: #1d4ed8;
        background: #eff6ff;
        transform: translateY(-1px);
      }
      button.choice:disabled { cursor: default; opacity: .6; }
      button.choice.correct-picked { border-color: #16a34a; background: #dcfce7; }
      button.choice.wrong-picked { border-color: #dc2626; background: #fee2e2; }
      button.choice.reveal { border-color: #16a34a; background: #dcfce7; }
      .score {
        background: #f8fafc;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .score .numbers { font-size: 1.6rem; font-weight: 800; color: #1d4ed8; }
      .score .pct { font-size: 1.1rem; color: #16a34a; font-weight: 700; margin-top: 4px; }
      .score .label { color: #6b7280; font-size: .85rem; text-transform: uppercase; letter-spacing: 1px; }
      #reset {
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        background: #1d4ed8;
        color: #fff;
        cursor: pointer;
        transition: background .15s ease;
      }
      #reset:hover { background: #1e40af; }
      .hint { color: #9ca3af; font-size: .8rem; margin-top: 14px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Nom propre ou nom commun ?</h1>
      <p class="subtitle">Ce mot affiché est-il un nom propre, un nom commun, ou aucun des deux ?</p>

      <div class="word-row">
        <div class="word" id="word">—</div>
        <a class="search-icon" id="searchLink" href="#" target="_blank" title="Rechercher ce mot" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
          </svg>
        </a>
      </div>
      <div class="word-meaning" id="wordMeaning"></div>
      <div class="feedback" id="feedback"></div>

      <div class="buttons">
        <button class="choice" data-answer="propre">Nom propre</button>
        <button class="choice" data-answer="commun">Nom commun</button>
        <button class="choice" data-answer="aucun">Aucun des deux</button>
      </div>

      <div class="score">
        <div class="label">Score</div>
        <div class="numbers"><span id="good">0</span> / <span id="total">0</span></div>
        <div class="pct" id="pct">— %</div>
      </div>

      <button id="reset">Réinitialiser</button>
      <div class="hint">Clique sur une réponse, le mot suivant apparaît automatiquement.</div>
    </main>

    <script>
      // propreté = nom propre, commun = nom commun, aucun = ni l'un ni l'autre
      // Grandes listes de base : la page construit une liste de plus de 1000 mots.
      const PRENOMS = ["Sally","Anaïs","Odile","Genty","Emma","Jade","Louise","Ambre","Alice","Chloé","Léa","Manon","Zoé","Abigaël","Adèle","Agathe","Alba","Alexia","Alix","Anaé","Anna","Apolline","Ariane","Aurore","Bianca","Capucine","Céleste","Céline","Charlène","Charlotte","Clara","Clarisse","Clemence","Coline","Constance","Coralie","Cyrielle","Delphine","Élise","Éloïse","Émilie","Emmanuelle","Estelle","Fanny","Fiona","Flora","Garance","Gilda","Héloïse","Hortense","Inès","Iris","Jeanne","Joséphine","Julia","Juliette","Kenza","Lana","Léonie","Lilou","Lisa","Liv","Louna","Lucie","Lydie","Madeleine","Margaux","Margot","Marine","Maya","Méliane","Mila","Nina","Noé","Noémie","Océane","Olivia","Romane","Rosalie","Rose","Salomé","Sarah","Sofia","Soline"," Suzanne","Tiphaine","Valentine","Violette","Yasmine","Adrien","Alexandre","Antoine","Arnaud","Arthur","Auguste","Basile","Baptiste","Benjamin","Cédric","Corentin","Damien","Diego","Dorian","Edgar","Elias","Ethan","Ethan","Félix","Gaël","Gaspard","Gauthier","Guillaume","Hugo","Ismaël","Jules","Kevin","Léo","Lucas","Marius","Matteo","Maxime","Nathan","Nicolas","Noah","Olivier","Pierre","Quentin","Raphaël","Rayan","Rémi","Robin","Romain","Samuel","Enzo","Théo","Timéo","Tom","Valentin","Victor","William","Youssouf","Zakari"];
      const VILLES = ["Paris","Marseille","Lyon","Toulouse","Nice","Nantes","Montpellier","Strasbourg","Bordeaux","Lille","Rennes","Reims","Le Havre","Toulon","Grenoble","Dijon","Angers","Nîmes","Villeurbanne","Clermont-Ferrand","Aix-en-Provence","Le Mans","Brest","Tours","Amiens","Limoges","Annecy","Boulogne-Billancourt","Perpignan","Metz","Besançon","Orléans","Rouen","Mulhouse","Caen","Nancy","Argenteuil","Saint-Denis","Roubaix","Tourcoing","Avignon","Nanterre","Créteil","Poitiers","Versailles","Pau","Aulnay-sous-Bois","Calais","Drancy","Antibes","Ajaccio","La Rochelle","Bayonne","Chambéry","Béziers","Niort","Colmar","Vichy","Deauville","Honfleur","Cannes","Saint-Tropez","Arles","Orange","Vaison-la-Romaine","Albi","Cahors","Rodez","Foix","Périgueux","Angoulême","La Rochelle","Laval","Arras","Douai","Valenciennes","Charleville-Mézières","Troyes","Chaumont","Nevers","Moulins","Bourges","Blois","Chartres","Évreux","Saint-Lô","Quimper","Vannes","Lorient","Saint-Brieuc","Lannion","Biarritz","Tarbes","Mont-de-Marsan","Auch","Agen","Montauban","Carcassonne","Perpignan","Toulon","Gap","Digne","Briançon","Nice","Menton","Sète","Martigues","Istres","Salon-de-Provence","Beaune","Auxerre","Sens","Langres","Bar-le-Duc","Épinal"];
      const PAYS_REGIONS = ["France","Espagne","Italie","Allemagne","Portugal","Belgique","Suisse","Autriche","Pays-Bas","Luxembourg","Royaume-Uni","Irlande","Écosse","Danemark","Norvège","Suède","Finlande","Islande","Pologne","Tchéquie","Slovaquie","Hongrie","Roumanie","Bulgarie","Grèce","Turquie","Russie","Ukraine","Égypte","Maroc","Algérie","Tunisie","Sénégal","Mali","Cameroun","Kenya","Nigeria","Afrique du Sud","Madagascar","Éthiopie","Chine","Japon","Corée","Inde","Vietnam","Thaïlande","Indonésie","Australie","Nouvelle-Zélande","Canada","Québec","États-Unis","Mexique","Brésil","Argentine","Chili","Pérou","Colombie","Bretagne","Normandie","Provence","Alsace","Savoie","Corse","Catalogne","Toscane","Bavière","Sicile","Floride","Californie","Sibérie","Tibet","Provence"];
      const MARQUES = ["Michelin","Nestlé","Danone","Renault","Peugeot","Citroën","Airbus","L'Oréal","Lacoste","Chanel","Dior","Hermès","Carrefour","Décathlon","Intersport","IKEA","Samsung","Toyota","Ferrari","Porsche","Mercedes","Volvo","Adidas","Nike","Levi's","Zara","Apple","Google","Microsoft","Amazon","Netflix","Spotify","PlayStation","Xbox","Barbie","Lego","Nintendo","Moleskine","Bic","Stabilo","Nesquik","Kinder","Nutella","Bounty","Twix","Orangina","Perrier","Evian","Volvic","Volvic"];
      const DIVERS_PROPRE = ["Seine","Loire","Rhône","Garonne","Marne","Somme","Moselle","Rhin","Danube","Nil","Amazone","Mississippi","Volga","Mont Blanc","Mont Ventoux","Pic du Midi","Tour Eiffel","Arc de Triomphe","Louvre","Château de Versailles","Notre-Dame","Sacré-Cœur","Molière","Racine","Voltaire","Hugo","Zola","Camus","Sartre","Beauvoir","Astérix","Obélix","Tintin","Milou","Lucky Luke","Vercingétorix","Batman","Superman","Spider-Man","Harry Potter","Mickey","Zinedine Zidane","Mbappé","Noah Lyles"];
      const NOMS_COMMUNS = ["chien","chat","cheval","vache","mouton","chèvre","cochon","poule","canard","lapin","souris","éléphant","girafe","lion","tigre","ours","loup","renard","singe","singe","dauphin","baleine","requin","tortue","lézard","serpent","papillon","abeille","fourmi","coccinelle","escargot","araignée","maison","appartement","immeuble","château","cabane","jardin","cour","cuisine","salon","chambre","toit","mur","porte","fenêtre","escalier","table","chaise","fauteuil","lit","armoire","commode","étagère","tapis","rideau","coussin","lampe","miroir","horloge","télévision","ordinateur","clavier","écran","téléphone","cahier","livre","cahier","crayon","stylo","gomme","règle","cartable","gomme","trousse","gomme","gomme","gomme","gomme","gomme","gomme","gomme","gomme","gomme"];
      const COMMUNS2 = ["école","classe","professeur","élève","récréation","cours","examen","leçon","devoir","cantine","bibliothèque","fleur","arbre","feuille","racine","branche","herbe","plante","rose","tulipe","marguerite","coquelicot","forêt","bois","champ","prairie","montagne","colline","vallée","rivière","lac","mer","océan","plage","sable","vague","île","désert","ciel","nuage","soleil","lune","étoile","pluie","neige","vent","orage","tonnerre","éclair","arc-en-ciel","brume","rosée","hiver","printemps","été","automne","matin","midi","soir","nuit","jour","semaine","mois","année","heure","minute","seconde","temps","ville","village","rue","avenue","boulevard","place","pont","phare","gare","aéroport","route","chemin","sentier","voiture","camion","moto","vélo","bateau","avion","train","bus","métro","wagon","roue","volant","moteur","pomme","poire","banane","orange","citron","fraise","cerise","raisin","pêche","abricot","prune","melon","pastèque","ananas","mangue","kiwi","carotte","tomate","salade","poireau","oignon","ail","pomme de terre","navet","courgette","aubergine","poivron","champignon","pain","beurre","fromage","lait","yaourt","œuf","viande","poisson","riz","pâtes","soupe","gâteau","biscuit","bonbon","chocolat","sucre","sel","poivre","huile","eau","jus","sirop","thé","café","famille","père","mère","frère","sœur","fils","fille","enfant","bébé","ami","voisin","cousin","oncle","tante","grand-mère","grand-père","métier","travail","usine","bureau","magasin","marché","boulangerie","pharmacie","hôpital","médecin","dentiste","infirmière","pompier","policier","agriculteur","boulanger","cuisinier","coiffeur","facteur","chauffeur","pilote","saule","peintre","chanteur","danseur","acteur","sport","football","tennis","natation","course","saut","ballon","filet","balle","raquette","vélo","jouet","poupée","ourson","cube","puzzle","jeu","carte","domino","dé","musique","guitare","piano","violon","tambour","chanson","danse","cinéma","film","dessin animé","histoire","conte","récit","poème","mot","phrase","lettre","chiffre","nombre","somme","Calcul","problème","question","réponse","idée","rêve","souvenir","pensée","bonheur","tristesse","joie","peur","colère","surprise","amour","amitié","courage","liberté","paix","guerre","bruit","silence","odeur","parfum","goût","couleur","lumière","ombre","chaleur","froid","feu","flamme","fumée","cendre","maladie","santé","force","faiblesse","sommeil","réveil","départ","arrivée","voyage","vacance","valise","sac","boîte","panier","pot","verre","assiette","cuillère","fourchette","couteau","casserole","poêle","four","toujours"];
      const VERBES = ["manger","boire","dormir","courir","marcher","sauter","nager","voler","chanter","danser","rire","pleurer","parler","dire","crier","chuchoter","écouter","entendre","voir","regarder","toucher","sentir","goûter","lire","écrire","dessiner","peindre","compter","calculer","jouer","travailler","étudier","apprendre","enseigner","comprendre","savoir","croire","penser","rêver","imaginer","inventer","construire","détruire","casser","réparer","ouvrir","fermer","allumer","éteindre","monter","descendre","entrer","sortir","arriver","partir","venir","aller","rester","habiter","vivre","naître","grandir","vieillir","tomber","se lever","s'asseoir","attendre","chercher","trouver","perdre","gagner","donner","recevoir","prendre","poser","lancer","attraper","pousser","tirer","porter","jeter","ramasser","nettoyer","laver","essuyer","balayer","ranger","plier","coudre","tricoter","couper","coller","attacher","détacher","boutonner","chauffer","refroidir","cuire","frire","griller","mélanger","verser","saler","sucrer","aider","obéir","protéger","garder","suivre","précéder","accompagner","remercier","excuser","pardonner","saluer","embrasser","téléphoner","envoyer","recevoir","choisir","décider","oser","essayer","commencer","finir","continuer","arrêter","recommencer","changer","tourner","avancer","reculer","glisser","rouler","rebondir"];
      const ADJECTIFS = ["grand","petit","gros","maigre","haut","bas","long","court","large","étroit","beau","joli","moche","laid","joli","bon","mauvais","gentil","méchant","sympathique","joyeux","triste","content","fâché","heureux","malheureux","courageux","peureux","fort","faible","rapide","lent","lourd","léger","dur","mou","doux","rugueux","lisse","chaud","froid","frais","tiède","brûlant","gelé","propre","sale","neuf","vieux","jeune","ancien","moderne"," neuf","plein","vide","ouvert","fermé","riche","pauvre","cher","gratuit","facile","difficile","simple","compliqué","clair","sombre","brillant","mat","coloré","blanc","noir","rouge","bleu","vert","jaune","orange","violet","rose","gris","marron","bruyant","silencieux","calme","agité","sérieux","drôle","amusant","ennuyeux","intéressant","curieux","sage","bavard","timide","poli","impoli","malin","bête","intelligent","fort","mince","rond","carré","triangulaire","carré","profond","superficiel","humide","sec","mouillé","sale","épais","fin","lourd","vert","mûr","pourri","croustillant","fondant","épicé","sucré","salé","amer","acide","dél ciré","fatigué","énergique","endormi","réveillé","malade","guéri","blessé","sain","malade","rusé","honnête","fidèle","jaloux","généreux","égoïste","patient","impatient","sportif","artiste","musical"];
      const ADVERBES_ET_AUTRES = ["doucement","fortement","rapidement","lentement","silencieusement","bruyamment","joyeusement","tristement","facilement","difficilement","sérieusement","poliment","gentiment","méchamment","soudain","longtemps","toujours","jamais","souvent","parfois","rarement","maintenant","hier","demain","tôt","tard","aujourd'hui","ici","là","partout","ailleurs","dedans","dehors","ensemble","seul","vite","bien","mieux","pis","mal","tant","tellement","assez","trop","presque","vraiment","peut-être","surtout","pourtant","alors","ensuite","d'abord","enfin","puis","ensuite","trois","cinq","dix","vingt","cent","mille","premier","deuxième","dernier","mon","ton","son","ma","ta","sa","mes","tes","ses","notre","votre","leur","ce","cet","cette","ces","un","une","des","le","la","les","du","de la","des","et","ou","mais","donc","car","ni","or","oui","non","peut-être","voilà"];

      // Construction de la liste : on fusionne, on nettoie et on retire les doublons.
      function buildWordList() {
        const propre = []
          .concat(PRENOMS, VILLES, PAYS_REGIONS, MARQUES, DIVERS_PROPRE)
          .map(w => ({ w: w.trim(), a: "propre" }));
        const commun = []
          .concat(NOMS_COMMUNS, COMMUNS2)
          .map(w => ({ w: w.trim(), a: "commun" }));
        const aucun = []
          .concat(
            VERBES.map(w => ({ w, t: "un verbe" })),
            ADJECTIFS.map(w => ({ w, t: "un adjectif" })),
            ADVERBES_ET_AUTRES.map(w => ({ w, t: "un adverbe ou un petit mot (déterminant, conjonction, pronom, nombre…)" }))
          )
          .map(item => ({ w: item.w.trim(), a: "aucun", t: item.t }));
        const seen = new Set();
        const all = [];
        for (const item of propre.concat(commun, aucun)) {
          if (item.w && item.w.length > 1 && !seen.has(item.w)) {
            seen.add(item.w);
            all.push(item);
          }
        }
        return all;
      }

      const WORDS = buildWordList();

      const LABELS = {
        propre: "C'est un nom propre (avec une majuscule, il désigne un être, un lieu ou une chose unique).",
        commun: "C'est un nom commun (il désigne une catégorie de personnes, d'animaux ou de choses).",
        aucun: "Ce n'est ni un nom propre ni un nom commun"
      };

      function explain(item) {
        if (item.a === "aucun") {
          return LABELS.aucun + " : c'est " + (item.t || "un autre type de mot") + ".";
        }
        return LABELS[item.a] + ".";
      }

      let deck = [], current = null;
      let stats = { good: 0, total: 0 };
      let answered = false;

      // Sauvegarde du score dans le localStorage (avec protection si indisponible)
      const STORAGE_KEY = "score-noms-propres-communs";
      function loadStats() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && typeof parsed.good === "number" && typeof parsed.total === "number") {
              stats = { good: parsed.good, total: parsed.total };
            }
          }
        } catch (e) { /* localStorage indisponible : on démarre à zéro */ }
      }
      function saveStats() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        } catch (e) { /* sauvegarde impossible : on ignore */ }
      }

      const wordEl = document.getElementById("word");
      const searchLink = document.getElementById("searchLink");
      const wordMeaningEl = document.getElementById("wordMeaning");
      const feedbackEl = document.getElementById("feedback");
      const goodEl = document.getElementById("good");
      const totalEl = document.getElementById("total");
      const pctEl = document.getElementById("pct");
      const buttons = Array.from(document.querySelectorAll("button.choice"));

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function nextWord() {
        if (deck.length === 0) deck = shuffle(WORDS);
        current = deck.pop();
        answered = false;
        wordEl.textContent = current.w;
        searchLink.href = "https://fr.wikipedia.org/w/index.php?search=" + encodeURIComponent(current.w);
        wordMeaningEl.innerHTML = "";
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        buttons.forEach(b => {
          b.disabled = false;
          b.className = "choice";
        });
      }

      function updateScore() {
        goodEl.textContent = stats.good;
        totalEl.textContent = stats.total;
        const pct = stats.total === 0 ? null : Math.round((stats.good / stats.total) * 100);
        pctEl.textContent = pct === null ? "— %" : pct + " %";
        pctEl.style.color = pct === null ? "#16a34a" : (pct >= 70 ? "#16a34a" : "#dc2626");
      }

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          stats.total++;
          const pick = btn.dataset.answer;
          const ok = pick === current.a;
          if (ok) {
            stats.good++;
            btn.classList.add("correct-picked");
            feedbackEl.textContent = "Bravo ! " + explain(current);
            feedbackEl.className = "feedback good";
          } else {
            btn.classList.add("wrong-picked");
            const goodBtn = buttons.find(b => b.dataset.answer === current.a);
            if (goodBtn) goodBtn.classList.add("reveal");
            feedbackEl.textContent = "Oups… " + explain(current);
            feedbackEl.className = "feedback bad";
          }
          buttons.forEach(b => (b.disabled = true));
          wordMeaningEl.innerHTML = '<a href="' + searchLink.href + '" target="_blank" rel="noopener noreferrer">🔎 En savoir plus sur ce mot</a>';
          updateScore();
          saveStats();
          setTimeout(nextWord, ok ? 3000 : 5000);
        });
      });

      document.getElementById("reset").addEventListener("click", () => {
        stats = { good: 0, total: 0 };
        saveStats();
        deck = [];
        updateScore();
        nextWord();
      });

      loadStats();
      updateScore();
      nextWord();
    </script>
  </body>
</html>
